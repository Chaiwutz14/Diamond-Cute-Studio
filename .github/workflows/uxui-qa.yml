name: UX/UI Visual and Regression QA

on:
  push:
    branches:
      - uxui/redesign-reference-mobile-desktop
      - uxui/reference-led-renovation-v2
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  browser-qa:
    name: Browser smoke and responsive QA
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install temporary browser test dependency
        run: |
          npm init -y
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install --with-deps chromium

      - name: Check JavaScript syntax
        run: |
          set -e
          while IFS= read -r file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find js -type f -name '*.js' | sort)

      - name: Run responsive and regression checks
        run: node tests/uxui-qa.mjs

      - name: Upload screenshots and QA measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dmc-uxui-qa-artifacts
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
